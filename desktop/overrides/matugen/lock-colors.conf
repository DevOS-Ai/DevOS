# DevOS lock screen colors (DESK-021), rendered by matugen from the wallpaper like the rest
# of the desktop. Read by ~/.config/hypr/hyprlock.conf.
$m3primary = rgba({{colors.primary.default.hex_stripped}}ff)
$m3onPrimary = rgba({{colors.on_primary.default.hex_stripped}}ff)
$m3primaryContainer = rgba({{colors.primary_container.default.hex_stripped}}ff)
$m3onPrimaryContainer = rgba({{colors.on_primary_container.default.hex_stripped}}ff)
$m3tertiary = rgba({{colors.tertiary.default.hex_stripped}}ff)
$m3surface = rgba({{colors.surface_container_low.default.hex_stripped}}cc)
$m3surfaceHigh = rgba({{colors.surface_container_high.default.hex_stripped}}ff)
$m3onSurface = rgba({{colors.on_surface.default.hex_stripped}}ff)
$m3onSurfaceVariant = rgba({{colors.on_surface_variant.default.hex_stripped}}ff)
$m3outline = rgba({{colors.outline.default.hex_stripped}}ff)
$m3outlineVariant = rgba({{colors.outline_variant.default.hex_stripped}}ff)
$m3error = rgba({{colors.error.default.hex_stripped}}ff)
$wallpaper = {{image}}
