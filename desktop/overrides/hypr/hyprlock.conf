# DevOS lock screen (SRS DESK-010, D-03): hyprlock in the desktop's Material You design.
# Colors and the background come from the wallpaper (devos-lock-colors.conf, rendered by
# matugen), so the lock screen matches the bar, sidebars and DevOS Agent. Installed for new
# users in place of end-4's hyprlock.conf; yours in ~/.config/hypr is never overwritten.

source = ~/.config/hypr/devos-lock-colors.conf
$font = Google Sans Flex
$mono = JetBrains Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 4, emphasizedDecel
    animation = fadeOut, 1, 4, emphasizedDecel
    animation = inputFieldDots, 1, 2, emphasizedDecel
}

background {
    monitor =
    path = $wallpaper
    color = $m3surface
    blur_passes = 3
    blur_size = 8
    brightness = 0.65
    vibrancy = 0.2
}

# Clock and date
label {
    monitor =
    text = <span weight="600">$TIME</span>
    color = $m3onSurface
    font_size = 104
    font_family = $font
    position = 0, -100
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $m3onSurfaceVariant
    font_size = 20
    font_family = $font
    position = 0, -250
    halign = center
    valign = top
}

# Card
shape {
    monitor =
    size = 400, 300
    color = $m3surface
    rounding = 23
    border_size = 1
    border_color = $m3outlineVariant
    position = 0, -60
    halign = center
    valign = center
}

# Avatar: user initial on the primary container, like the DevOS Agent panel mark
shape {
    monitor =
    size = 84, 84
    color = $m3primaryContainer
    rounding = -1
    border_size = 0
    position = 0, 20
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] printf '<span weight="600">%s</span>' "$(printf '%s' "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]')"
    color = $m3onPrimaryContainer
    font_size = 30
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}
label {
    monitor =
    text = <span weight="500">$USER</span>
    color = $m3onSurface
    font_size = 16
    font_family = $font
    position = 0, -50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 344, 50
    outline_thickness = 2
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $m3primary
    inner_color = $m3surfaceHigh
    font_color = $m3onSurface
    font_family = $font
    check_color = $m3tertiary
    fail_color = $m3error
    capslock_color = $m3tertiary
    fade_on_empty = false
    placeholder_text = Password
    fail_text = Wrong password. Try again.
    fail_timeout = 4000
    position = 0, -110
    halign = center
    valign = center
}

# Brand, bottom-left
label {
    monitor =
    text = <span font_family="JetBrains Mono" weight="bold">›_</span>  <b>DevOS</b>
    color = $m3primary
    font_size = 15
    font_family = $font
    position = 30, 28
    halign = left
    valign = bottom
}

# Keyboard layout, bottom-right
label {
    monitor =
    text = $LAYOUT
    color = $m3onSurfaceVariant
    font_size = 13
    font_family = $mono
    position = -30, 28
    halign = right
    valign = bottom
}
