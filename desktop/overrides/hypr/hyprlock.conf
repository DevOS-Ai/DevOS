# DevOS lock screen (SRS DESK-010, D-03): hyprlock in the DevOS login design.
# Same background, palette and layout as the login screen. Installed for new users
# in place of end-4's hyprlock.conf; yours in ~/.config/hypr is never overwritten.

$text = rgba(e6edf7ff)
$muted = rgba(8a96abff)
$faint = rgba(5c6880ff)
$teal = rgba(2dd4bfff)
$violet = rgba(8b5cf6ff)
$danger = rgba(f87171ff)
$warning = rgba(fbbf24ff)
$font = Inter
$mono = JetBrains Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = devosDecel, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 4, devosDecel
    animation = fadeOut, 1, 4, devosDecel
    animation = inputFieldDots, 1, 2, devosDecel
}

background {
    monitor =
    path = /usr/share/devos/greeter/background.jpg
    color = rgba(070a11ff)
    blur_passes = 2
    blur_size = 6
    brightness = 0.75
}

# Clock and date
label {
    monitor =
    text = <b>$TIME</b>
    color = $text
    font_size = 96
    font_family = $font
    position = 0, -110
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $muted
    font_size = 20
    font_family = $font
    position = 0, -250
    halign = center
    valign = top
}

# Login card: the same 400 px card as the login screen
shape {
    monitor =
    size = 400, 300
    color = rgba(0b111bb8)
    rounding = 24
    border_size = 1
    border_color = rgba(ffffff17)
    position = 0, -60
    halign = center
    valign = center
}

# Avatar: user initial on the DevOS accent gradient
shape {
    monitor =
    size = 84, 84
    color = rgba(0e1521ff)
    rounding = -1
    border_size = 3
    border_color = $teal $violet 45deg
    position = 0, 20
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] printf '<b>%s</b>' "$(printf '%s' "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]')"
    color = $text
    font_size = 30
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}
label {
    monitor =
    text = <span weight="600">$USER</span>
    color = $text
    font_size = 16
    font_family = $font
    position = 0, -50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 344, 46
    outline_thickness = 1
    rounding = 12
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(2dd4bfcc)
    inner_color = rgba(ffffff0d)
    font_color = $text
    font_family = $font
    check_color = $teal
    fail_color = $danger
    capslock_color = $warning
    fade_on_empty = false
    placeholder_text = <span foreground="##5c6880">Password</span>
    fail_text = Wrong password. Try again.
    fail_timeout = 4000
    position = 0, -110
    halign = center
    valign = center
}

# Brand, bottom-left
label {
    monitor =
    text = <span foreground="##2dd4bf" font_family="JetBrains Mono" weight="bold">›_</span>  <b>DevOS</b>
    color = $text
    font_size = 15
    font_family = $font
    position = 30, 28
    halign = left
    valign = bottom
}

# Keyboard layout, bottom-right
label {
    monitor =
    text = $LAYOUT
    color = $faint
    font_size = 13
    font_family = $mono
    position = -30, 28
    halign = right
    valign = bottom
}
