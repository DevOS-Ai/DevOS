# DevOS lock screen (SRS DESK-010, D-03): hyprlock in the end-4 lock layout and Material You.
# Colors and the background come from the wallpaper (devos-lock-colors.conf, rendered by
# matugen), so the lock screen matches the bar, sidebars and DevOS Agent. Installed for new
# users in place of end-4's hyprlock.conf; yours in ~/.config/hypr is never overwritten.

source = ~/.config/hypr/devos-lock-colors.conf
$font = Google Sans Flex
$mono = JetBrains Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 4, emphasizedDecel
    animation = fadeOut, 1, 4, emphasizedDecel
    animation = inputFieldDots, 1, 2, emphasizedDecel
}

background {
    monitor =
    path = $wallpaper
    color = $m3surface
    blur_passes = 0
    brightness = 0.85
}

# Clock and date (as on the login screen and the end-4 lock screen)
label {
    monitor =
    text = <span weight="600">$TIME</span>
    color = $m3onSurface
    font_size = 132
    font_family = $font
    position = 0, -130
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $m3onSurfaceVariant
    font_size = 22
    font_family = $font
    position = 0, -320
    halign = center
    valign = top
}

# Bottom toolbars: user on the left, password in the center (end-4 lock layout)
shape {
    monitor =
    size = 380, 56
    color = $m3surface
    rounding = -1
    position = 0, 24
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 364, 40
    outline_thickness = 2
    rounding = -1
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = false
    outer_color = $m3primary
    inner_color = $m3surfaceHigh
    font_color = $m3onSurface
    font_family = $font
    check_color = $m3tertiary
    fail_color = $m3error
    capslock_color = $m3tertiary
    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = Incorrect password
    fail_timeout = 4000
    position = 0, 32
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 200, 56
    color = $m3surface
    rounding = -1
    position = -300, 24
    halign = center
    valign = bottom
}
shape {
    monitor =
    size = 40, 40
    color = $m3primaryContainer
    rounding = -1
    position = -368, 32
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:0] printf '<span weight="600">%s</span>' "$(printf '%s' "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]')"
    color = $m3onPrimaryContainer
    font_size = 15
    font_family = $font
    position = -368, 40
    halign = center
    valign = bottom
}
label {
    monitor =
    text = <span weight="500">$USER</span>
    color = $m3onSurface
    font_size = 15
    font_family = $font
    position = -290, 41
    halign = center
    valign = bottom
}

# DevOS, top-left; keyboard layout, top-right
label {
    monitor =
    text = <span font_family="JetBrains Mono" weight="bold">›_</span>  <b>DevOS</b>
    color = $m3onSurface
    font_size = 15
    font_family = $font
    position = 26, -24
    halign = left
    valign = top
}
label {
    monitor =
    text = $LAYOUT
    color = $m3onSurfaceVariant
    font_size = 13
    font_family = $font
    position = -26, -24
    halign = right
    valign = top
}
