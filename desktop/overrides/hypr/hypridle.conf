# DevOS idle and lock (SRS DESK-010): end-4's hypridle settings, locking with
# hyprlock (the DevOS lock screen in hypr/hyprlock.conf).
# Super+L and the session menu run `loginctl lock-session`, which calls lock_cmd.
$lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15 min: suspend
    on-timeout = $suspend_cmd
}
