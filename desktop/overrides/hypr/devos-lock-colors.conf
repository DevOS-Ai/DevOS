# DevOS lock screen colors: the DevOS scheme until the first wallpaper is applied; then
# matugen rewrites this file from the wallpaper (see ~/.config/matugen/config.toml).
$m3primary = rgba(53dbc9ff)
$m3onPrimary = rgba(003731ff)
$m3primaryContainer = rgba(005048ff)
$m3onPrimaryContainer = rgba(74f8e5ff)
$m3tertiary = rgba(c9bfffff)
$m3surface = rgba(161d1fcc)
$m3surfaceHigh = rgba(252b2dff)
$m3onSurface = rgba(dee3e5ff)
$m3onSurfaceVariant = rgba(bfc8cbff)
$m3outline = rgba(899295ff)
$m3outlineVariant = rgba(3f484bff)
$m3error = rgba(ffb4abff)
$wallpaper = /usr/share/backgrounds/devos/devos.jpg
